<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Social link profile | Frontend Mentor</title>
  </head>
  <body>
    <main class="card">
      <div class="link_img">
        <img
          src="./assets/images/avatar-jessica.jpeg"
          alt=" A Profile Image here"
        />
      </div>
      <p class="Img desc">
        <h1 class="userName">Jessica Randall</h1>
        <h2 class="userLocation">London, United Kingdom</h2>
      </p>

      <p class="userDesc">"Frontend developer and avid reader."</p>

      <nav class="profile__links">
        <button class="github_link">
          <a href="#"> Github</a>
        </button>
        <button class="frontend_link">
          <a href="#"> Frontend Mentor</a>
        </button>

        <button class="linkedln_link">
          <a href="#"> Linkedln</a>
        </button>

        <button class="twitter_link">
          <a href="#"> Twitter</a>
        </button>

        <button class="instagram_link">
          <a href="#"> Instagram</a>
        </button>
      </nav>
    </main>
  </body>
</html>
