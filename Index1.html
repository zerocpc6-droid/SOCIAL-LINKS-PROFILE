<!doctype html>
<html lang="en">
  <head>
    <!-- META-TAGS -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- FAVICON -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <!-- CSS SHEET -->
    <link rel="stylesheet" href="style.css" />
    <!-- TITLE -->
    <title>Social link profile | Frontend Mentor</title>
  </head>
  <body>
    <main class="card">
      <div class="link_img">
        <img
          class="profile__img"
          src="./assets/images/avatar-jessica.jpeg"
          alt=" A Profile Image here"
        />

        <p class="userName">Jessica Randall</p>
        <p class="userLocation">London, United Kingdom</p>

        <p class="userDesc">"Frontend developer and avid reader."</p>
      </div>

      <nav class="profile__links">
        <button class="github_link">
          <a href="#"> Github</a>
        </button>
        <button class="frontend_link">
          <a href="#"> Frontend Mentor</a>
        </button>

        <button class="linkedln_link">
          <a href="#"> Linkedln</a>
        </button>

        <button class="twitter_link">
          <a href="#"> Twitter</a>
        </button>

        <button class="instagram_link">
          <a href="#"> Instagram</a>
        </button>
      </nav>
    </main>
  </body>
</html>
