<!doctype html>
<html lang="en">
  <head>
    <!-- META-TAGS -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- FAVICON -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <!-- FONT LINK -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- CSS SHEET -->
    <link rel="stylesheet" href="style.css" />
    <!-- TITLE -->
    <title>Social link profile | Frontend Mentor</title>
  </head>
  <body>
    <main class="card">
      <div class="link_img">
        <img
          class="profile__img"
          src="./assets/images/avatar-jessica.jpeg"
          alt=" Jessica Randall's profile image"
        />

        <p class="userName">Jessica Randall</p>
        <p class="userLocation">London, United Kingdom</p>

        <p class="userDesc">"Frontend developer and avid reader."</p>
      </div>

      <nav class="profile__links">
        <a class="github_link" href="#"> Github</a>

        <a class="frontend_link" href="#"> Frontend Mentor</a>

        <a class="linkedln_link" href="#"> Linkedln</a>

        <a class="twitter_link" href="#"> Twitter</a>

        <a class="instagram_link" href="#"> Instagram</a>
      </nav>
    </main>
  </body>
</html>
